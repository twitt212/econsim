[workspace]
resolver = "2"
members = ["crates/econsim-core", "crates/econsim-server", "crates/econsim-cli"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
rand_pcg = "0.3"
rand_distr = "0.4"
rayon = "1.10"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = false

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
